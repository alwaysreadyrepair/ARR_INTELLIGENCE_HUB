# Off until the repository variable REFRESH_ENABLED is "true". Needs the "production" GitHub environment's secrets (docs/RUNBOOK.md).
name: Refresh traffic
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      first_run:
        description: No live snapshot exists yet
        type: boolean
        default: false
permissions:
  contents: read
concurrency: refresh-traffic
jobs:
  refresh:
    if: vars.REFRESH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      FIRST: ${{ inputs.first_run && '--first-run' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run snapshot -- pull traffic production $FIRST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A failed step keeps the previous data for that step, so a partial refresh is still pushed; the job then fails.
      - id: refresh
        run: npm run traffic:refresh
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      - run: npm run snapshot -- push traffic production $FIRST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.refresh.outcome == 'failure'
        run: exit 1
