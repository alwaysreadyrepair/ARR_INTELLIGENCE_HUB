name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test           # lib, SEO and mock-repository tests
      - run: npm run check      # astro check (types)
      - run: npm run build      # build (not deployed anywhere yet)
