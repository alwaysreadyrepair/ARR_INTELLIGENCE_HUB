# Off until the repository variable REFRESH_ENABLED is "true". Needs the "production" GitHub environment's secrets (docs/RUNBOOK.md).
name: Refresh seo
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      first_run:
        description: No live snapshot exists yet
        type: boolean
        default: false
permissions:
  contents: read
concurrency: refresh-seo
jobs:
  refresh:
    if: vars.REFRESH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      FIRST: ${{ inputs.first_run && '--first-run' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run snapshot -- pull seo production $FIRST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A failed step keeps the previous data for that step, so a partial refresh is still pushed; the job then fails.
      - id: refresh
        run: npm run seo:refresh -- --max-usd="${MAX_USD:-0}"
        continue-on-error: true
        env:
          MAX_USD: ${{ vars.SEO_MAX_USD }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: npm run snapshot -- push seo production $FIRST
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.refresh.outcome == 'failure'
        run: exit 1
